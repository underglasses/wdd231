<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You</title>
  <link rel="stylesheet" href="styles/small.css">
  <link rel="stylesheet" href="styles/large.css">
</head>
<body>
  <header>
    <img src="images/logo.png" alt="Chamber Logo" class="logo">
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="directory.html">Directory</a></li>
        <li><a href="join.html">Join</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Thank You for Joining!</h1>
    <p>First Name: <span id="firstName"></span></p>
    <p>Last Name: <span id="lastName"></span></p>
    <p>Email: <span id="email"></span></p>
    <p>Phone: <span id="phone"></span></p>
    <p>Organization: <span id="organization"></span></p>
    <p>Date Submitted: <span id="timestamp"></span></p>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Manta Chamber of Commerce</p>
    <p>Last Modified: <span id="lastModified"></span></p>
  </footer>

  <script src="scripts/home.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('firstName').textContent = params.get('firstName');
    document.getElementById('lastName').textContent = params.get('lastName');
    document.getElementById('email').textContent = params.get('email');
    document.getElementById('phone').textContent = params.get('phone');
    document.getElementById('organization').textContent = params.get('organization');
    document.getElementById('timestamp').textContent = params.get('timestamp');
  </script>
</body>
</html>
